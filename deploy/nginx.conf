# Put these two directives in the nginx http {} context.
limit_req_zone $binary_remote_addr zone=attestor:10m rate=6r/m;
limit_conn_zone $binary_remote_addr zone=attestor_conn:10m;

server {
    listen 443 ssl;
    server_name attestor.example.com;
    ssl_certificate /etc/letsencrypt/live/attestor.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/attestor.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 512k;
    client_body_timeout 10s;
    send_timeout 15s;
    limit_conn attestor_conn 10;
    limit_req_status 429;

    location / {
        limit_req zone=attestor burst=3 nodelay;
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Replace, never append: discard all inbound client IP assertions.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP "";
        proxy_set_header X-Vercel-Forwarded-For "";
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 110s;
        proxy_send_timeout 15s;
    }
}
